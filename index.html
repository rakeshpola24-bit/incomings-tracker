<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Money coming to you</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;background:#eef0f6;color:#181c2a;line-height:1.45}
button,input{font:inherit}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
.hero{background:linear-gradient(150deg,#312e81,#4f46e5 55%,#7c3aed);color:#fff;border-radius:26px;padding:30px 22px 26px;text-align:center;box-shadow:0 14px 34px rgba(63,56,190,.32);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero small{display:block;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero b{display:block;font-size:48px;font-weight:800;margin:8px 0 4px;letter-spacing:-1.5px}
.hero span{font-size:14px;opacity:.85;font-weight:500}
h2{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6b7186;margin:26px 6px 10px}
.row{background:#fff;border-radius:18px;padding:15px 14px;margin:10px 0;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px rgba(24,28,42,.06);border:1px solid #e6e8f0}
.av{width:44px;height:44px;border-radius:14px;background:#eceafd;color:#4f46e5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:none}
.info{flex:1;min-width:0}
.who{font-weight:600;font-size:16px;color:#181c2a}
.why{font-size:13px;color:#7a7f92;margin-top:1px}
.tap{font-size:11px;color:#a3a8bb;margin-top:3px}
.amt{font-weight:700;font-size:16px;white-space:nowrap;color:#181c2a}
button{border:0;border-radius:12px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer}
.pay{background:#4f46e5;color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.28)}
.row.paid{opacity:.55}.row.paid .amt{text-decoration:line-through}.row.paid .pay{background:#e6e8f0;color:#5a5f73;box-shadow:none}
.del{background:none;color:#b6bacb;padding:6px;font-size:15px}
form{display:grid;gap:10px;background:#fff;padding:16px 14px;border-radius:18px;border:1px solid #e6e8f0;box-shadow:0 2px 8px rgba(24,28,42,.06)}
input{padding:13px 14px;border:1px solid #d8dbe6;border-radius:12px;font-size:16px;background:#f8f9fc;color:#181c2a}
input:focus{outline:2px solid #4f46e5;border-color:#4f46e5;background:#fff}
form button{background:#181c2a;color:#fff;padding:14px;font-size:15px}
.note{font-size:12px;color:#9499ad;text-align:center;margin-top:16px}
.ov{position:fixed;inset:0;background:rgba(16,20,38,.55);display:flex;align-items:flex-end;justify-content:center;padding:14px;z-index:60}
.ov[hidden]{display:none}
.card{background:#fff;border-radius:24px 24px 18px 18px;width:100%;max-width:460px;max-height:80vh;overflow:auto;padding:22px 18px;box-shadow:0 20px 54px rgba(0,0,0,.35)}
.card h3{margin:0;font-size:20px;font-weight:700;color:#181c2a}
.card .dtd{font-size:13px;color:#7a7f92;margin:3px 0 12px}
.dl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px;border-bottom:1px dashed #e4e6ee;color:#3a3f52}
.dl span:last-child{white-space:nowrap;font-weight:600;color:#181c2a}
.dl.r span:last-child{color:#c2333b}
.dsub{display:flex;justify-content:space-between;padding:10px 0;font-size:15px;font-weight:700;border-bottom:1px solid #d8dbe6;color:#181c2a}
.dtot{display:flex;justify-content:space-between;padding:14px 0 2px;font-size:19px;font-weight:800;color:#4f46e5}
.close{width:100%;margin-top:16px;background:#181c2a;color:#fff;padding:13px;font-size:15px}
</style></head><body><main>
<div class="hero"><small>You will get</small><b id="total">Rs 0</b><span id="sub"></span></div>
<h2>Who owes you</h2>
<div id="list"></div>
<h2>Add new</h2>
<form id="f"><input id="p" placeholder="Name" required><input id="r" placeholder="Note (optional)"><input id="a" type="number" min="0" step="any" placeholder="Amount (Rs)" required><button>Add</button></form>
<p class="note" id="upd">Paid marks and rows you add are saved on this phone only.</p>
</main>
<div class="ov" id="ov" hidden><div class="card" id="card"></div></div>
<script>
var K="incomings-v2",S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={paid:{},mine:[]};
var base=[],items=[];
var ov=document.getElementById("ov");
function save(){localStorage.setItem(K,JSON.stringify(S))}
function fmt(n){return "Rs "+Number(n).toLocaleString("en-IN")}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function showDetail(x){
var d=x.d||{};var h='<h3>'+esc(x.p)+'</h3>';
if(d.date)h+='<div class="dtd">'+esc(d.date)+'</div>';
(d.rows||[]).forEach(function(r){h+='<div class="dl"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>'});
if(d.subtotal)h+='<div class="dsub"><span>Total</span><span>'+esc(d.subtotal)+'</span></div>';
(d.received||[]).forEach(function(r){h+='<div class="dl r"><span>'+esc(r[0])+'</span><span>- '+esc(r[1])+'</span></div>'});
(d.extra||[]).forEach(function(r){h+='<div class="dl"><span>'+esc(r[0])+'</span><span>+ '+esc(r[1])+'</span></div>'});
h+='<div class="dtot"><span>Pending</span><span>'+fmt(x.a)+'</span></div>';
if(d.infoTitle)h+='<div class="dsub" style="margin-top:12px;border-bottom:0"><span>'+esc(d.infoTitle)+'</span><span></span></div>';
(d.info||[]).forEach(function(r){h+='<div class="dl"><span>'+esc(r[0])+'</span><span>'+esc(r[1])+'</span></div>'});
h+='<button class="close">Close</button>';
var c=document.getElementById("card");c.innerHTML=h;
c.querySelector(".close").onclick=function(){ov.hidden=true};
ov.hidden=false;
}
ov.onclick=function(e){if(e.target===ov)ov.hidden=true};
function draw(){
var t=0,c=0,l=document.getElementById("list");l.innerHTML="";
items=base.concat(S.mine);
items.forEach(function(x){
var d=!!S.paid[x.id];
if(!d){t+=+x.a;c++}
var e=document.createElement("div");e.className="row"+(d?" paid":"");
e.innerHTML='<div class="av">'+esc((x.p||"?").charAt(0).toUpperCase())+'</div><div class="info"><div class="who">'+esc(x.p)+'</div>'+(x.r?'<div class="why">'+esc(x.r)+'</div>':'')+(x.d?'<div class="tap">Tap name for details</div>':'')+'</div><div class="amt">'+fmt(x.a)+'</div><button class="pay">'+(d?"Paid":"Mark paid")+'</button>'+(x.mine?'<button class="del">x</button>':'');
if(x.d){e.querySelector(".av").style.cursor="pointer";e.querySelector(".info").style.cursor="pointer";
var open=function(){showDetail(x)};
e.querySelector(".av").onclick=open;e.querySelector(".info").onclick=open}
e.querySelector(".pay").onclick=function(){if(d)delete S.paid[x.id];else S.paid[x.id]=1;save();draw()};
var del=e.querySelector(".del");
if(del)del.onclick=function(){if(confirm("Delete "+x.p+"?")){S.mine=S.mine.filter(function(m){return m.id!==x.id});delete S.paid[x.id];save();draw()}};
l.appendChild(e)});
document.getElementById("total").textContent=fmt(t);
document.getElementById("sub").textContent=c?c+(c==1?" person":" people")+" still to pay":"All paid. Nothing pending.";
}
document.getElementById("f").onsubmit=function(ev){ev.preventDefault();
S.mine.push({id:"m"+Date.now(),p:p.value,r:r.value,a:+a.value,mine:true});save();draw();this.reset()};
fetch("data.json?t="+Date.now()).then(function(r){return r.json()}).then(function(j){base=j.items||[];if(j.updated)document.getElementById("upd").textContent="List updated "+j.updated+". Paid marks and rows you add are saved on this phone only.";draw()}).catch(function(){draw()});
draw();
</script></body></html>
